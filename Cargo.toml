[package]
name = "mdpad--"
version = "0.1.0"
edition = "2026"
description = "MarkdownPad - a pure-Rust offline WYSIWYG Markdown / MDX / Markdoc editor"
authors = ["MCJPG"]
readme = "README.md"

[dependencies]
# --- GUI ---
eframe = { version = "0.37", features = ["persistence", "glow"] }
egui = "0.37"
# `image` feature lets the editor display local raster assets (PNG/JPEG/WebP)
# referenced from Markdown, and output produced by optional external renderers.
egui_extras = { version = "0.37", features = ["image"] }

# --- Font files are mapped, not read (see src/fonts.rs) ---
memmap2 = "0.9"

# --- Native file dialogs ---
rfd = "0.17"

# --- Persisted settings / recent files ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# --- Diagnostics ---
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# The engine layer (parsers, IR, LaTeX typesetter, diagram layout) deliberately
# exposes a wider API than the current UI consumes — it is written to be
# testable and extensible. Unused-item warnings there are expected, not defects.
[lints.rust]
dead_code = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# LTO measured within 0.3 MB of private working set and cost 8x the build time,
# so it stays off. The symbol table is not read at run time, so it goes.
strip = true
